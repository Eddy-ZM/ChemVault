name: Forms retention purge

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forms-retention-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORMS_RETENTION_SECRET: ${{ secrets.FORMS_RETENTION_SECRET }}
    steps:
      - name: Purge expired closed submissions
        run: |
          test -n "$FORMS_RETENTION_SECRET"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $FORMS_RETENTION_SECRET" \
            https://chemvault-aw3.pages.dev/api/internal/forms/purge
