<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Detail | ChemVault</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f5f5f7" />
  <script src="/scripts/boot.js?v=20260618c"></script>
  <link rel="icon" href="/favicon.ico?v=20260628a" sizes="any" />
  <link rel="icon" href="/assets/chemvault-logo-mark.png?v=20260628a" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/assets/chemvault-apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/styles.css?v=20260702b" />
  <link rel="stylesheet" href="/assets/forms-admin.css?v=20260702a" />
  <script src="/scripts/site-shell.js?v=20260702b" defer></script>
  <script src="/scripts/leads-admin.js?v=20260703a" defer></script>
</head>
<body class="page-shell forms-admin-shell" data-boot-label="Lead Detail" data-admin-lead-detail>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true"><img src="/assets/chemvault-logo-mark.png" alt="" /></span><span><strong>ChemVault</strong><small>leads admin</small></span></a>
      <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="Admin navigation">
        <a href="/admin/forms/">Forms</a>
        <a href="/admin/leads/">Leads</a>
        <a href="/index.html">Main site</a>
      </nav>
      <div class="header-actions"><button class="theme-toggle" type="button" data-shell-action="theme" aria-label="Switch theme"><span class="theme-toggle__icon" aria-hidden="true"></span></button></div>
    </div>
  </header>

  <main id="main" class="forms-admin-main">
    <div class="container">
      <div class="forms-admin-header">
        <div>
          <span class="section-kicker">Lead detail</span>
          <h1 data-lead-title>Lead detail</h1>
          <p data-lead-summary>Loading lead...</p>
        </div>
        <a class="forms-button forms-button--ghost" href="/admin/leads/">Back to leads</a>
      </div>

      <section class="forms-panel" aria-label="Admin token">
        <div class="forms-form forms-token-row">
          <input class="forms-token" type="password" autocomplete="off" data-admin-token placeholder="CHEMVAULT_ADMIN_TOKEN" />
          <button class="forms-button forms-button--quiet" type="button" data-admin-token-save>Use token</button>
        </div>
      </section>

      <div class="forms-detail-grid">
        <section class="forms-detail-content">
          <article class="forms-panel">
            <div class="forms-panel__header">
              <div>
                <h2 data-lead-email>Lead</h2>
                <p data-lead-tracking></p>
              </div>
            </div>
            <div class="forms-meta-grid" data-lead-meta></div>
            <div class="forms-form">
              <div class="forms-field">
                <span>Message</span>
                <div class="forms-detail-message" data-lead-message></div>
              </div>
            </div>
          </article>
        </section>

        <aside class="forms-detail-content">
          <section class="forms-panel">
            <div class="forms-panel__header">
              <div>
                <h3>Status</h3>
                <p>Archive contacted leads or mark follow-up state.</p>
              </div>
            </div>
            <form class="forms-form" data-lead-status-form>
              <div class="forms-field">
                <label for="leadStatus">Status</label>
                <select id="leadStatus" name="status">
                  <option value="new">new</option>
                  <option value="notified">notified</option>
                  <option value="failed">failed</option>
                  <option value="subscribed">subscribed</option>
                  <option value="contacted">contacted</option>
                  <option value="archived">archived</option>
                </select>
              </div>
              <button class="forms-button" type="submit">Save status</button>
              <button class="forms-button forms-button--quiet" type="button" data-lead-notify>Resend admin notification</button>
              <p class="forms-status" data-lead-action-status aria-live="polite"></p>
            </form>
          </section>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
