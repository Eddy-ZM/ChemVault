<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads Admin | ChemVault</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f5f5f7" />
  <script src="/scripts/boot.js?v=20260618c"></script>
  <link rel="icon" href="/favicon.ico?v=20260628a" sizes="any" />
  <link rel="icon" href="/assets/chemvault-logo-mark.png?v=20260628a" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/assets/chemvault-apple-touch-icon.png?v=20260628a" />
  <link rel="stylesheet" href="/assets/styles.css?v=20260717b" />
  <link rel="stylesheet" href="/assets/forms-admin.css?v=20260702a" />
  <script src="/scripts/site-shell.js?v=20260702b" defer></script>
  <script src="/scripts/leads-admin.js?v=20260703b" defer></script>
</head>
<body class="page-shell forms-admin-shell" data-boot-label="Leads Admin" data-admin-leads-list>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true"><img src="/assets/chemvault-logo-mark.png" alt="" /></span><span><strong>ChemVault</strong><small>leads admin</small></span></a>
      <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="Admin navigation">
        <a href="/admin/forms/">Forms</a>
        <a href="/admin/leads/" aria-current="page">Leads</a>
        <a href="/index.html">Main site</a>
      </nav>
      <div class="header-actions"><button class="theme-toggle" type="button" data-shell-action="theme" aria-label="Switch theme"><span class="theme-toggle__icon" aria-hidden="true"></span></button></div>
    </div>
  </header>

  <main id="main" class="forms-admin-main">
    <div class="container">
      <div class="forms-admin-header">
        <div>
          <span class="section-kicker">Leads / Newsletter</span>
          <h1>Lead table</h1>
          <p data-leads-summary>Loading leads...</p>
        </div>
        <a class="forms-button forms-button--ghost" href="/pages/pricing.html#enterprise-lead">Open lead forms</a>
      </div>

      <section class="forms-panel forms-admin-session" aria-label="Admin access">
        <div>
          <strong data-admin-session-label>Checking admin access...</strong>
          <p data-admin-session-detail>Cloudflare Access or ChemVault User permissions are preferred.</p>
        </div>
        <div class="forms-form forms-token-row" data-admin-token-panel>
          <input class="forms-token" type="password" autocomplete="off" data-admin-token placeholder="CHEMVAULT_ADMIN_TOKEN" />
          <button class="forms-button forms-button--quiet" type="button" data-admin-token-save>Use token</button>
        </div>
      </section>

      <section class="forms-toolbar" aria-label="Lead table controls">
        <input type="search" data-leads-search placeholder="Search email, name, message, source" />
        <select data-leads-status>
          <option value="">All statuses</option>
          <option value="new">new</option>
          <option value="notified">notified</option>
          <option value="failed">failed</option>
          <option value="subscribed">subscribed</option>
          <option value="contacted">contacted</option>
          <option value="archived">archived</option>
        </select>
        <select data-leads-type>
          <option value="">All types</option>
          <option value="newsletter">newsletter</option>
          <option value="ai_beta">ai_beta</option>
          <option value="enterprise">enterprise</option>
        </select>
        <select data-leads-direction>
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </section>

      <p class="forms-status" data-leads-status-message aria-live="polite"></p>

      <div class="forms-table-wrap">
        <table class="forms-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-date">Time</th>
              <th class="col-type">Type</th>
              <th class="col-email">Email</th>
              <th class="col-title">Source / Message</th>
              <th class="col-status">Status</th>
              <th class="col-owner">Last error</th>
            </tr>
          </thead>
          <tbody data-leads-table>
            <tr><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <nav class="forms-pagination" aria-label="Pagination">
        <div>
          <button class="forms-button forms-button--quiet" type="button" data-leads-prev>Previous</button>
          <button class="forms-button forms-button--quiet" type="button" data-leads-next>Next</button>
        </div>
        <div>
          <span data-leads-page>Page 1</span>
          <select data-leads-limit>
            <option value="25">25 rows</option>
            <option value="50" selected>50 rows</option>
            <option value="100">100 rows</option>
          </select>
        </div>
      </nav>
    </div>
  </main>
</body>
</html>
